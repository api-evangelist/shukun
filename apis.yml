description: Shukun Technology (数坤科技) is a Beijing-based, globally operating AI medical-imaging company
  founded in 2017. It builds an AI-powered "Digital Doctor" portfolio (CoronaryDoc, NeuroDoc and related
  Digital Heart / Digital Brain products) that analyzes CT and other medical images to assist clinicians in
  screening, diagnosing, and planning treatment for cardiovascular, cerebrovascular, chest, abdominal and
  musculoskeletal disease. Shukun holds NMPA Class III certificates, EU MDR CE markings, and US FDA
  clearance across several therapeutic areas, and its products are deployed in nearly 3,000 healthcare
  institutions. The company is a clinical/enterprise AI vendor with no public developer or API surface at
  the time of this enrichment pass.
